name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject agent co-author trailers in PR commits
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git log "${base}..HEAD" --format=%B | grep -qE 'Co-authored-by: Cursor |cursoragent@cursor.com|Made-with: Cursor'; then
            echo "Remove IDE agent attribution from commit messages in this PR."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Run gofmt -w ."
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          golangci-lint run ./...

      - name: coverage-gate
        run: make coverage-gate
